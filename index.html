<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Flying Carpet</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#1B1330; touch-action:none; }
  #game-container { width:100%; height:100%; display:flex; align-items:center; justify-content:center; touch-action:none; }
  #game-container canvas { max-width:100%; max-height:100%; }

  #dialogue-box {
    position:fixed; left:50%; bottom:4%;
    transform:translateX(-50%);
    width:min(640px, 92vw);
    background:linear-gradient(180deg,#2a2044 0%,#1B1330 100%);
    border:2px solid #E8A33D;
    border-radius:18px 18px 6px 6px;
    padding:20px 90px 18px 26px;
    color:#EFE3C8;
    font-family:Georgia,'Times New Roman',serif;
    box-shadow:0 8px 30px rgba(0,0,0,0.55);
    z-index:20;
    transition:opacity 0.2s ease, transform 0.2s ease;
  }
  #dialogue-box::before {
    content:"";
    position:absolute; top:-20px; left:50%;
    transform:translateX(-50%);
    width:52px; height:20px;
    background:#2a2044;
    border:2px solid #E8A33D;
    border-bottom:none;
    border-radius:26px 26px 0 0;
  }
  #dialogue-box.hidden { opacity:0; pointer-events:none; transform:translateX(-50%) translateY(10px); }
  #dialogue-speaker {
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    font-size:12px; letter-spacing:2px; text-transform:uppercase;
    color:#4EC9C0; margin-bottom:6px;
  }
  #dialogue-text { font-size:19px; line-height:1.45; min-height:52px; }
  #dialogue-next-btn {
    position:absolute; right:16px; bottom:16px;
    background:#E8A33D; color:#1B1330;
    font-family:'Trebuchet MS',sans-serif; font-weight:bold; font-size:13px;
    padding:8px 14px; border-radius:20px;
    display:flex; align-items:center; gap:5px;
    cursor:pointer; touch-action:none;
    animation:pulse 1.4s ease-in-out infinite;
    box-shadow:0 2px 8px rgba(0,0,0,0.4);
  }
  #dialogue-next-btn:active { transform:scale(0.94); }
  @keyframes pulse { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }

  #dpad {
    position:fixed; bottom:6%; left:5%;
    display:grid; grid-template-columns:repeat(3,50px); grid-template-rows:repeat(3,50px); gap:3px;
    z-index:15;
  }
  #dpad.hidden { display:none; }
  .touch-btn {
    touch-action:none;
    background:rgba(239,227,200,0.14);
    border:2px solid rgba(239,227,200,0.5);
    border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; color:#EFE3C8;
    user-select:none; -webkit-user-select:none;
  }
  .touch-btn:active { background:rgba(239,227,200,0.32); }

  #hint-banner {
    position:fixed; top:6%; left:50%; transform:translateX(-50%);
    max-width:86vw;
    font-family:Georgia,serif; font-style:italic;
    color:#EFE3C8; font-size:14px; text-align:center;
    background:rgba(27,19,48,0.72);
    padding:8px 18px; border-radius:20px;
    z-index:20; opacity:1; transition:opacity 0.4s ease;
  }
  #hint-banner.hidden { opacity:0; }

  @media (max-width:700px) {
    #dialogue-text { font-size:16px; }
    #dialogue-box { padding:18px 80px 16px 20px; }
  }
</style>
</head>
<body>

<div id="game-container"></div>

<div id="dialogue-box" class="hidden">
  <div id="dialogue-speaker"></div>
  <div id="dialogue-text"></div>
  <div id="dialogue-next-btn">Next &#9654;</div>
</div>

<div id="dpad" class="hidden">
  <div></div><div id="btn-up" class="touch-btn">&#9650;</div><div></div>
  <div id="btn-left" class="touch-btn">&#9664;</div><div></div><div id="btn-right" class="touch-btn">&#9654;</div>
  <div></div><div id="btn-down" class="touch-btn">&#9660;</div><div></div>
</div>

<div id="hint-banner" class="hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
<script>
/* =========================================================================
   THE FLYING CARPET — vertical slice v2
   Illustrated-vector art system + fixed carpet mechanic + free-roam bazaar.
   Deferred to next pass: the illustrated route-map scene between village
   and palace (see the exit zone comment in AREAS.village).
   ========================================================================= */

const COLORS = {
  ink:0x1B1330, outline:0x2A1B3D, dusk:0x4A2F6B,
  saffron:0xE8A33D, gold:0xF0C85A,
  turquoise:0x2F9B96, turquoiseDark:0x1F6B66,
  terracotta:0xC17A4F, terracottaDark:0x8A5A3C,
  parchment:0xEFE3C8, silhouette:0x241A2E,
  crimson:0x8B2635,
  skin1:0xE0B88A, skin2:0xC98F5E,
  leaf:0x5C8A52, leafDark:0x3E6339, bark:0x6B4A35,
  rock:0x8A8478, rockDark:0x625D53,
  water:0x4EC9C0, cloudWhite:0xF5EEDD, sand:0xD9B98A
};

/* ---------- save state (in-memory in this preview; see note at bottom) --- */
const GameState = {
  flags:{},
  set(k,v){ this.flags[k]=v; this.persist(); },
  get(k){ return this.flags[k]; },
  persist(){ window.__flyingCarpetSave = JSON.stringify(this.flags); },
  restore(){ if (window.__flyingCarpetSave){ try{ this.flags = JSON.parse(window.__flyingCarpetSave); }catch(e){} } }
};

/* ---------- dialogue (HTML overlay; advances ONLY via the Next button) --- */
const Dialogue = {
  el:null, speakerEl:null, textEl:null, btnEl:null,
  queue:[], active:false, onDone:null,
  init(){
    this.el = document.getElementById('dialogue-box');
    this.speakerEl = document.getElementById('dialogue-speaker');
    this.textEl = document.getElementById('dialogue-text');
    this.btnEl = document.getElementById('dialogue-next-btn');
    this.btnEl.addEventListener('pointerdown', (e) => { e.stopPropagation(); this.advance(); });
  },
  show(lines, onDone){
    this.queue = lines.slice();
    this.onDone = onDone || null;
    this.active = true;
    this.el.classList.remove('hidden');
    this._next();
  },
  _next(){
    if (this.queue.length === 0) { this._close(); return; }
    const line = this.queue.shift();
    if (line.speaker) { this.speakerEl.textContent = line.speaker; this.speakerEl.style.display='block'; }
    else { this.speakerEl.style.display='none'; }
    this.textEl.textContent = line.text;
  },
  advance(){ if (this.active) this._next(); },
  _close(){
    this.active = false;
    this.el.classList.add('hidden');
    const cb = this.onDone; this.onDone = null;
    if (cb) cb();
  }
};

/* ---------- touch d-pad (4-directional; hidden during carpet/dialogue scenes) */
const Touch = {
  left:false, right:false, up:false, down:false, el:null,
  init(){
    this.el = document.getElementById('dpad');
    const bind = (id, prop) => {
      const btn = document.getElementById(id);
      btn.addEventListener('pointerdown', (e) => { e.preventDefault(); this[prop] = true; });
      btn.addEventListener('pointerup', () => { this[prop] = false; });
      btn.addEventListener('pointerleave', () => { this[prop] = false; });
      btn.addEventListener('pointercancel', () => { this[prop] = false; });
    };
    bind('btn-left','left'); bind('btn-right','right');
    bind('btn-up','up'); bind('btn-down','down');
  },
  show(){ this.el.classList.remove('hidden'); },
  hide(){ this.el.classList.add('hidden'); this.left=this.right=this.up=this.down=false; }
};

function showHint(text, duration) {
  const el = document.getElementById('hint-banner');
  el.textContent = text;
  el.classList.remove('hidden');
  clearTimeout(showHint._t);
  showHint._t = setTimeout(() => el.classList.add('hidden'), duration || 3400);
}

/* =========================================================================
   PROCEDURAL ART — everything below is drawn in code (no image files).
   Rule followed throughout: physics-relevant sprites are baked at their
   FINAL pixel size with no runtime setScale(), so Arcade Physics can
   auto-size their collision body from the texture frame with no manual
   offsets to get wrong. Manual body sizing is used in exactly one place
   (the carpet) and is set to match its texture dimensions exactly.
   ========================================================================= */
function ensureTexture(scene, key, w, h, drawFn) {
  if (scene.textures.exists(key)) return key;
  const g = scene.add.graphics();
  drawFn(g);
  g.generateTexture(key, w, h);
  g.destroy();
  return key;
}

function fillSky(scene, width, height, top, bottom) {
  const g = scene.add.graphics();
  g.fillGradientStyle(top, top, bottom, bottom, 1);
  g.fillRect(0, 0, width, height);
  return g;
}

/* ---- characters: layered, outlined, chibi-proportioned, 3-5 colors ----- */
function makeCharacterTexture(scene, key, opts) {
  const o = Object.assign({
    skin:COLORS.skin1, robe:COLORS.terracotta, accent:COLORS.saffron,
    headwear:'cap', headwearColor:0x5a4a6a, beard:false, expression:'neutral'
  }, opts);
  const W = 44, H = 66;
  return ensureTexture(scene, key, W, H, (g) => {
    const cx = W/2;
    g.fillStyle(0x000000, 0.18);
    g.fillEllipse(cx, H-3, 26, 7);

    g.fillStyle(COLORS.outline, 1);
    g.fillRoundedRect(cx-13, H-22, 12, 18, 5);
    g.fillRoundedRect(cx+1, H-22, 12, 18, 5);
    g.fillStyle(o.skin, 1);
    g.fillRoundedRect(cx-11, H-20, 10, 16, 5);
    g.fillRoundedRect(cx+1, H-20, 10, 16, 5);

    g.fillStyle(COLORS.outline, 1);
    g.fillRoundedRect(cx-19, 22, 38, 32, {tl:9,tr:9,bl:5,br:5});
    g.fillStyle(o.robe, 1);
    g.fillRoundedRect(cx-17, 24, 34, 30, {tl:8,tr:8,bl:4,br:4});
    g.fillStyle(o.accent, 1);
    g.fillRect(cx-17, 40, 34, 5);

    g.fillStyle(COLORS.outline, 1);
    g.fillRoundedRect(cx-25, 27, 10, 22, 5);
    g.fillRoundedRect(cx+15, 27, 10, 22, 5);
    g.fillStyle(o.robe, 1);
    g.fillRoundedRect(cx-23, 28, 8, 20, 4);
    g.fillRoundedRect(cx+15, 28, 8, 20, 4);

    const headY = 20, headR = 15;
    g.fillStyle(COLORS.outline, 1);
    g.fillCircle(cx, headY, headR+2.5);
    g.fillStyle(o.skin, 1);
    g.fillCircle(cx, headY, headR);

    if (o.beard) {
      g.fillStyle(0x3a322a, 1);
      g.fillEllipse(cx, headY+12, 17, 13);
      g.fillStyle(o.skin, 1);
      g.fillEllipse(cx, headY+6, 15, 9);
    }

    drawHeadwear(g, cx, headY, headR, o.headwear, o.headwearColor);

    const eyeY = headY - 1, eyeDX = 6;
    let browTilt = 0, mouthCurve = 0;
    if (o.expression === 'stern') { browTilt = 3; mouthCurve = -1.5; }
    else if (o.expression === 'kind') { browTilt = -2; mouthCurve = 1.5; }

    g.fillStyle(COLORS.outline, 1);
    g.fillEllipse(cx-eyeDX, eyeY, 4.5, 5.5);
    g.fillEllipse(cx+eyeDX, eyeY, 4.5, 5.5);
    g.fillStyle(0xffffff, 0.95);
    g.fillCircle(cx-eyeDX+1.3, eyeY-1.3, 1.2);
    g.fillCircle(cx+eyeDX+1.3, eyeY-1.3, 1.2);

    g.lineStyle(2, COLORS.outline, 1);
    g.beginPath(); g.moveTo(cx-eyeDX-4, eyeY-6-browTilt); g.lineTo(cx-eyeDX+4, eyeY-7+browTilt); g.strokePath();
    g.beginPath(); g.moveTo(cx+eyeDX-4, eyeY-7+browTilt); g.lineTo(cx+eyeDX+4, eyeY-6-browTilt); g.strokePath();

    if (!o.beard) {
      g.lineStyle(2, COLORS.outline, 0.85);
      g.beginPath();
      g.moveTo(cx-5, headY+8+mouthCurve); g.lineTo(cx, headY+9-mouthCurve); g.lineTo(cx+5, headY+8+mouthCurve);
      g.strokePath();
    }
  });
}

function drawHeadwear(g, cx, headY, headR, type, color) {
  if (type === 'none') return;
  if (type === 'cap') {
    g.fillStyle(COLORS.outline, 1);
    g.fillEllipse(cx, headY-headR+3, headR*1.5+3, 12);
    g.fillStyle(color, 1);
    g.fillEllipse(cx, headY-headR+3, headR*1.5, 10);
  } else if (type === 'turban') {
    g.fillStyle(COLORS.outline, 1);
    g.fillEllipse(cx, headY-headR+2, headR*1.9+3, 20);
    g.fillStyle(color, 1);
    g.fillEllipse(cx, headY-headR+2, headR*1.9, 18);
    g.fillStyle(COLORS.outline, 0.35);
    g.fillRect(cx-headR*0.9, headY-headR-2, headR*1.8, 3);
  } else if (type === 'crown') {
    g.fillStyle(COLORS.outline, 1);
    g.fillEllipse(cx, headY-headR+4, headR*1.8+3, 14);
    g.fillStyle(color, 1);
    g.fillEllipse(cx, headY-headR+4, headR*1.8, 12);
    g.fillStyle(COLORS.gold, 1);
    g.fillTriangle(cx-9, headY-headR+2, cx+9, headY-headR+2, cx, headY-headR-18);
    g.fillStyle(0xC0392B, 1);
    g.fillCircle(cx, headY-headR-3, 3.4);
  } else if (type === 'helmet') {
    g.fillStyle(COLORS.outline, 1);
    g.fillCircle(cx, headY-3, headR+3);
    g.fillStyle(color, 1);
    g.fillCircle(cx, headY-3, headR+1);
    g.fillStyle(COLORS.gold, 1);
    g.fillTriangle(cx-3, headY-headR-1, cx+3, headY-headR-1, cx, headY-headR-9);
  }
}

/* ---- a properly unsettling skull for the intro hall ---- */
function makeSkullTexture(scene, key) {
  const W=34, H=40;
  return ensureTexture(scene, key, W, H, (g) => {
    g.fillStyle(0x1a1420, 0.6);
    g.fillEllipse(W/2, H*0.9, W*0.7, H*0.16);
    g.fillStyle(0x8f8570, 1);
    g.fillEllipse(W/2, H*0.38, W*0.82, H*0.58);
    g.fillTriangle(W*0.16, H*0.42, W*0.84, H*0.42, W/2, H*0.9);
    g.fillStyle(0x14101c, 1);
    g.fillEllipse(W*0.34, H*0.4, W*0.2, H*0.24);
    g.fillEllipse(W*0.66, H*0.4, W*0.2, H*0.24);
    g.fillTriangle(W*0.46, H*0.52, W*0.54, H*0.52, W/2, H*0.64);
    g.fillStyle(0x14101c, 0.55);
    g.fillRect(W*0.3, H*0.84, W*0.4, 3);
    g.fillStyle(0x8f8570, 1);
    for (let i=0;i<4;i++) g.fillRect(W*0.32+i*W*0.09, H*0.8, W*0.06, H*0.14);
  });
}

function makeDomeTexture(scene, key, color, ribColor) {
  const w=70, h=90;
  return ensureTexture(scene, key, w, h, (g) => {
    g.fillStyle(COLORS.terracottaDark, 1);
    g.fillRect(w*0.30, h*0.55, w*0.40, h*0.45);
    g.fillStyle(COLORS.outline, 1);
    g.fillEllipse(w/2, h*0.42, w*0.86, h*0.66);
    g.fillStyle(color, 1);
    g.fillEllipse(w/2, h*0.42, w*0.8, h*0.6);
    g.fillTriangle(w/2, 0, w*0.42, h*0.28, w*0.58, h*0.28);
    g.lineStyle(2, ribColor, 0.6);
    g.beginPath(); g.moveTo(w*0.2, h*0.44); g.lineTo(w*0.5, h*0.16); g.lineTo(w*0.8, h*0.44); g.strokePath();
    g.fillStyle(COLORS.gold, 1);
    g.fillCircle(w/2, 0, 3);
  });
}

function makeMinaretTexture(scene, key) {
  const w=34, h=200;
  return ensureTexture(scene, key, w, h, (g) => {
    g.fillStyle(COLORS.outline, 1);
    g.fillRect(w*0.24, h*0.18, w*0.52, h*0.82);
    g.fillStyle(COLORS.terracotta, 1);
    g.fillRect(w*0.27, h*0.2, w*0.46, h*0.78);
    g.fillStyle(COLORS.saffron, 1);
    g.fillRect(w*0.18, h*0.32, w*0.64, 5);
    g.fillRect(w*0.18, h*0.6, w*0.64, 5);
    g.fillStyle(COLORS.turquoise, 1);
    g.fillEllipse(w/2, h*0.14, w*0.66, h*0.2);
    g.fillTriangle(w/2, 0, w*0.38, h*0.1, w*0.62, h*0.1);
  });
}

function makeBuildingTexture(scene, key, type) {
  const W = type==='mosque'?90:(type==='stall'?70:(type==='bakery'?100:80));
  const H = type==='mosque'?110:(type==='stall'?55:(type==='bakery'?85:75));
  return ensureTexture(scene, key, W, H, (g) => {
    if (type === 'stall') {
      g.fillStyle(COLORS.outline,1); g.fillRect(1,H*0.1-2,W-2,H*0.24+3);
      g.fillStyle(COLORS.crimson,1); g.fillRect(4,H*0.12,W-8,H*0.2);
      for (let i=0;i<5;i++){
        g.fillStyle(i%2===0?COLORS.parchment:COLORS.crimson,1);
        const sx=4+i*(W-8)/5;
        g.fillTriangle(sx,H*0.32,sx+(W-8)/5,H*0.32,sx+(W-8)/10,H*0.32+6);
      }
      g.fillStyle(COLORS.outline,1); g.fillRect(4,H*0.54-2,W-8,H*0.4+4);
      g.fillStyle(COLORS.terracottaDark,1); g.fillRect(6,H*0.55,W-12,H*0.38);
      const dotColors=[COLORS.gold,COLORS.crimson,COLORS.turquoise];
      for(let i=0;i<4;i++){ g.fillStyle(dotColors[i%3],1); g.fillCircle(16+i*11, H*0.62, 4.5); }
    } else if (type === 'mosque') {
      g.fillStyle(COLORS.outline,1); g.fillRect(W*0.15-2,H*0.35-2,W*0.7+4,H*0.65+4);
      g.fillStyle(COLORS.terracotta,1); g.fillRect(W*0.15,H*0.35,W*0.7,H*0.65);
      g.fillStyle(COLORS.outline,1); g.fillEllipse(W/2,H*0.32,W*0.64,H*0.42);
      g.fillStyle(COLORS.turquoise,1); g.fillEllipse(W/2,H*0.32,W*0.6,H*0.38);
      g.lineStyle(2,COLORS.turquoiseDark,0.7);
      g.beginPath(); g.moveTo(W*0.28,H*0.34); g.lineTo(W/2,H*0.08); g.lineTo(W*0.72,H*0.34); g.strokePath();
      g.fillStyle(COLORS.gold,1); g.fillCircle(W/2,H*0.05,4);
      g.fillStyle(0x14101c,0.7); g.fillRoundedRect(W*0.4,H*0.68,W*0.2,H*0.32,{tl:10,tr:10,bl:0,br:0});
      g.lineStyle(1,COLORS.gold,0.5);
      for(let i=0;i<3;i++) g.strokeCircle(W*0.15+ i*W*0.23,H*0.5,4);
    } else if (type === 'bakery') {
      g.fillStyle(COLORS.outline,1); g.fillRect(1,H*0.35-2,W-2,H*0.65+4);
      g.fillStyle(COLORS.terracottaDark,1); g.fillRect(2,H*0.36,W-4,H*0.64);
      [0.2,0.5,0.8].forEach((f)=>{
        g.fillStyle(COLORS.outline,1); g.fillRect(W*f-5,H*0.1,10,H*0.28);
        g.fillStyle(COLORS.terracotta,1); g.fillRect(W*f-4,H*0.12,8,H*0.24);
      });
      g.fillStyle(0x14101c,0.7); g.fillRoundedRect(W*0.4,H*0.68,W*0.2,H*0.32,{tl:8,tr:8,bl:0,br:0});
      g.fillStyle(0xE8742E,0.85); g.fillRect(W*0.14,H*0.5,W*0.16,W*0.13);
      g.fillStyle(0xE8742E,0.85); g.fillRect(W*0.7,H*0.5,W*0.16,W*0.13);
    } else {
      g.fillStyle(COLORS.outline,1); g.fillRect(1,H*0.3-2,W-2,H*0.7+3);
      g.fillStyle(COLORS.terracottaDark,1); g.fillRect(2,H*0.32,W-4,H*0.68);
      g.fillStyle(COLORS.outline,1); g.fillTriangle(-3,H*0.32+2,W+3,H*0.32+2,W/2,-3);
      g.fillStyle(COLORS.crimson,1); g.fillTriangle(0,H*0.32,W,H*0.32,W/2,2);
      g.fillStyle(0x14101c,0.65); g.fillRoundedRect(W*0.38,H*0.62,W*0.24,H*0.38,{tl:6,tr:6,bl:0,br:0});
      g.fillStyle(COLORS.saffron,0.85); g.fillRect(W*0.14,H*0.46,W*0.16,W*0.16);
      g.fillStyle(COLORS.saffron,0.85); g.fillRect(W*0.7,H*0.46,W*0.16,W*0.16);
      g.lineStyle(1,COLORS.outline,0.6);
      g.strokeRect(W*0.14,H*0.46,W*0.16,W*0.16); g.strokeRect(W*0.7,H*0.46,W*0.16,W*0.16);
    }
  });
}

function makeTreeTexture(scene, key) {
  const W=26,H=54;
  return ensureTexture(scene,key,W,H,(g)=>{
    g.fillStyle(COLORS.outline,1); g.fillRect(W/2-5,H*0.55-1,10,H*0.45+1);
    g.fillStyle(COLORS.bark,1); g.fillRect(W/2-4,H*0.55,8,H*0.45);
    g.fillStyle(COLORS.outline,1); g.fillEllipse(W/2,H*0.3,W*0.92+3,H*0.64+3);
    g.fillStyle(COLORS.leaf,1); g.fillEllipse(W/2,H*0.3,W*0.92,H*0.64);

function lerpColor(c1, c2, t) {
  t = Phaser.Math.Clamp(t, 0, 1);
  const r1=(c1>>16)&0xff, g1=(c1>>8)&0xff, b1=c1&0xff;
  const r2=(c2>>16)&0xff, g2=(c2>>8)&0xff, b2=c2&0xff;
  const r=Math.round(r1+(r2-r1)*t), g=Math.round(g1+(g2-g1)*t), b=Math.round(b1+(b2-b1)*t);
  return (r<<16)|(g<<8)|b;
}

/* One small reusable particle: a dot that drifts by (dx,dy) and fades out.
   Used for embers, steam, crumb bursts, and splashes -- a single simple,
   fully manual implementation rather than the particle-emitter API, so its
   behavior is easy to verify by reading it. */
function spawnParticle(scene, x, y, opts) {
  opts = opts || {};
  const p = scene.add.circle(x, y, opts.size!==undefined?opts.size:2.5, opts.color!==undefined?opts.color:0xF5B44A, opts.alpha!==undefined?opts.alpha:0.9);
  scene.tweens.add({
    targets:p,
    x: x + (opts.dx!==undefined?opts.dx:Phaser.Math.Between(-15,15)),
    y: y + (opts.dy!==undefined?opts.dy:-Phaser.Math.Between(40,80)),
    alpha:0,
    duration: opts.duration||900,
    ease: opts.ease||'Sine.easeOut',
    onComplete:()=>p.destroy()
  });
  return p;
}

/* =========================================================================
   OPEN AREA SCENE — generic free-roam scene (4-directional movement,
   depth-sorting, collidable scenery, NPC dialogue, exits). Used for both
   the village/bazaar and the oven couple's location; future chapters just
   add a new entry to AREAS.
   ========================================================================= */
class OpenAreaScene extends Phaser.Scene {
  constructor(){ super('OpenAreaScene'); }
  init(data){ this.areaKey = data.areaKey; }
  create(){
    const area = AREAS[this.areaKey];
    this.area = area;
    this.sliceEnded = false;
    this.leaving = false;

    this.physics.world.setBounds(0,0,area.width,area.height);
    this.cameras.main.setBounds(0,0,area.width,area.height);

    this.buildGround(area);
    this.buildDecor(area);

    makeCharacterTexture(this,'player-tex',PLAYER_APPEARANCE);
    this.player = this.physics.add.sprite(area.playerStart.x, area.playerStart.y, 'player-tex').setOrigin(0.5,1);
    this.player.setCollideWorldBounds(true);
    this.cameras.main.startFollow(this.player, true, 0.1, 0.1);

    this.physics.add.collider(this.player, this.decorColliders);

    this.npcSprites = [];
    area.npcs.forEach((npc,i) => {
      const key = 'npc-'+this.areaKey+'-'+i;
      if (npc.spriteType === 'grave') makeGraveTexture(this, key);
      else makeCharacterTexture(this, key, npc.appearance);
      const spr = this.add.image(npc.x, npc.y, key).setOrigin(0.5,1).setDepth(npc.y);
      spr.npcData = npc; spr.playerInside = false;
      if (npc.spriteType !== 'grave') {
        this.tweens.add({ targets:spr, scaleY:1.03, duration:1300+Math.random()*400, yoyo:true, repeat:-1, ease:'Sine.easeInOut' });
      }
      this.npcSprites.push(spr);
    });

    (area.exits||[]).forEach((ex) => {
      const z = this.add.zone(ex.x, ex.y, ex.w||70, ex.h||70);
      this.physics.add.existing(z, true);
      this.physics.add.overlap(this.player, z, () => this.tryExit(ex));
    });

    this.cursors = this.input.keyboard.createCursorKeys();
    this.wasd = this.input.keyboard.addKeys('W,A,S,D');

    Touch.show();
    this.time.delayedCall(250, () => showHint(area.intro));
  }
  update(){
    if (Dialogue.active || this.sliceEnded || this.leaving) { this.player.setVelocity(0,0); return; }
    let vx=0, vy=0;
    if (this.cursors.left.isDown || this.wasd.A.isDown || Touch.left) vx -= 1;
    if (this.cursors.right.isDown || this.wasd.D.isDown || Touch.right) vx += 1;
    if (this.cursors.up.isDown || this.wasd.W.isDown || Touch.up) vy -= 1;
    if (this.cursors.down.isDown || this.wasd.S.isDown || Touch.down) vy += 1;
    if (vx!==0 && vy!==0) { vx*=0.7071; vy*=0.7071; }
    const speed=170;
    this.player.setVelocity(vx*speed, vy*speed);
    if (vx<0) this.player.setFlipX(true); else if (vx>0) this.player.setFlipX(false);
    this.player.setDepth(this.player.y);
    this.checkProximity();
  }
  checkProximity(){
    this.npcSprites.forEach((spr) => {
      const d = Phaser.Math.Distance.Between(this.player.x, this.player.y, spr.x, spr.y);
      const inside = d < 42;
      if (inside && !spr.playerInside) this.talkTo(spr);
      spr.playerInside = inside;
    });
  }
  buildGround(area){
    const g=this.add.graphics();
    g.fillGradientStyle(area.skyTop,area.skyTop,area.groundColor,area.groundColor,1);
    g.fillRect(0,0,area.width,area.height);
    g.fillStyle(COLORS.outline,0.06);
    for (let y=40; y<area.height; y+=70){
      for (let x=(Math.round(y/70)%2===0?0:35); x<area.width; x+=70){
        g.fillTriangle(x,y-5,x+5,y,x,y+5);
        g.fillTriangle(x+5,y,x+10,y-5,x+10,y+5);
      }
    }
  }
  buildDecor(area){
    this.decorColliders = this.physics.add.staticGroup();
    area.structures.forEach((s) => {
      const texKey = 'struct-'+s.type+(s.variant||'');
      if (s.type==='house') makeBuildingTexture(this,texKey,'house');
      else if (s.type==='stall') makeBuildingTexture(this,texKey,'stall');
      else if (s.type==='mosque') makeBuildingTexture(this,texKey,'mosque');
      else if (s.type==='bakery') makeBuildingTexture(this,texKey,'bakery');
      else if (s.type==='tree') makeTreeTexture(this,texKey);
      else if (s.type==='deadtree') makeDeadTreeTexture(this,texKey);
      else if (s.type==='rock') makeRockTexture(this,texKey);
      else if (s.type==='well') makeWellTexture(this,texKey);
      else if (s.type==='gate') makeGateTexture(this,texKey);

      this.add.image(s.x, s.y, texKey).setOrigin(0.5,1).setDepth(s.y);

      if (s.type==='well'){
        const glowDot=this.add.ellipse(s.x, s.y-11, 20, 8, COLORS.water, 0.5).setDepth(s.y+1);
        this.tweens.add({ targets:glowDot, alpha:0.15, duration:1300, yoyo:true, repeat:-1 });
      }

      if (s.collide){
        const fw=s.footW||40, fh=s.footH||18;
        const fz=this.add.zone(s.x, s.y - fh/2, fw, fh);
        this.physics.add.existing(fz, true);
        this.decorColliders.add(fz);
      }
    });
  }
  talkTo(spr){
    if (Dialogue.active || this.sliceEnded) return;
    const npc = spr.npcData;
    let lines;
    if (typeof npc.getDialogue === 'function') lines = npc.getDialogue();
    else if (npc.isTarget) lines = npc.dialogue;
    else lines = [{ speaker:(npc.spriteType==='grave' ? '' : 'Villager'), text:npc.hint }];

    Dialogue.show(lines, () => {
      if (npc.isTarget || npc.getDialogue) {
        if (npc.flag) GameState.set(npc.flag, true);
        if (npc.onComplete) npc.onComplete(this);
      }
    });
  }
  tryExit(ex){
    if (Dialogue.active || this.sliceEnded || this.leaving) return;
    if (ex.requiresFlag && !GameState.get(ex.requiresFlag)) { showHint(ex.lockedHint || "Not yet."); return; }
    this.leaving = true;
    Touch.hide();
    this.cameras.main.fadeOut(400,0,0,0);
    this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start(ex.toScene, ex.toData||{}));
  }
  endOfSlice(nextNeeded){
    this.sliceEnded = true;
    Touch.hide();
    const sx=this.cameras.main.scrollX, sy=this.cameras.main.scrollY;
    this.add.rectangle(sx+400,sy+225,800,450,0x0b0714,0.88).setScrollFactor(0).setDepth(5000);
    this.add.text(sx+400,sy+180,'You need to find the '+nextNeeded+'.',{fontFamily:'Georgia, serif',fontSize:'21px',color:'#EFE3C8'}).setOrigin(0.5).setScrollFactor(0).setDepth(5001);
    this.add.text(sx+400,sy+226,'\u2014 End of this preview build \u2014',{fontFamily:'Georgia, serif',fontSize:'15px',fontStyle:'italic',color:'#E8A33D'}).setOrigin(0.5).setScrollFactor(0).setDepth(5001);
    this.add.text(sx+400,sy+262,'More chapters are on the way.',{fontFamily:'Trebuchet MS, sans-serif',fontSize:'13px',color:'#EFE3C8'}).setOrigin(0.5).setScrollFactor(0).setDepth(5001);
  }
}

/* =========================================================================
   BAKERY SCENE — "keep the oven temperature right, move the loaves."
   No fail state by design: straying out of the good zone just pauses baking
   progress rather than punishing the player, matching the 'very easy' brief.
   ========================================================================= */
class BakeryScene extends Phaser.Scene {
  constructor(){ super('BakeryScene'); }
  init(data){
    this.nextScene = data.nextScene || 'OpenAreaScene';
    this.nextSceneData = data.nextSceneData || {};
  }
  create(){
    Touch.hide();
    this.temp = 55;
    this.zoneMin = 40; this.zoneMax = 70;
    this.batchesComplete = 0;
    this.batchTarget = 5;
    this.done = false;
    this.emberTimer = 1;

    this.buildBackground();
    this.buildGauge();
    this.buildLoaves();
    this.buildStokeButton();

    this.progressText = this.add.text(400,40,'',{fontFamily:'Trebuchet MS, sans-serif',fontSize:'16px',color:'#EFE3C8'}).setOrigin(0.5);
    this.updateProgressText();

    this.time.delayedCall(300, () => {
      Dialogue.show([{ speaker:'', text:"The ovens run from dawn to noon. Keep the fire tended, and see it through." }]);
    });
  }
  buildBackground(){
    fillSky(this,800,450,0x3a2418,0x1a1008);
    const floor=this.add.graphics(); floor.fillStyle(COLORS.terracottaDark,1); floor.fillRect(0,360,800,90);
    makeOvenTexture(this,'oven-tex');
    this.add.image(400,340,'oven-tex').setOrigin(0.5,1).setScale(1.5);

    /* Fire glow is separate from the oven shell so its size/brightness can
       react to the live temperature, and it gets its own flicker. */
    this.glowOuter = this.add.ellipse(400,246,70,54,0xE8742E,0.85);
    this.glowInner = this.add.ellipse(400,258,42,30,0xF5B44A,0.9);

    this.add.rectangle(700,150,64,74,0x1a1008).setStrokeStyle(3,COLORS.outline,1);
    makeCharacterTexture(this,'watcher-tex', PLAYER_APPEARANCE);
    this.watcherImg = this.add.image(700,196,'watcher-tex').setOrigin(0.5,1).setScale(0.85);
    this.tweens.add({ targets:this.watcherImg, scaleY:0.88, duration:1500, yoyo:true, repeat:-1, ease:'Sine.easeInOut' });
  }
  buildGauge(){
    const gx=60, gy=386, gw=680, gh=26;
    this.gx=gx; this.gy=gy; this.gw=gw; this.gh=gh;
    const bg=this.add.graphics();
    bg.fillStyle(0x000000,0.4); bg.fillRoundedRect(gx-3,gy-3,gw+6,gh+6,8);
    bg.fillStyle(0x2a2044,1); bg.fillRoundedRect(gx,gy,gw,gh,6);
    const zoneX=gx+(this.zoneMin/100)*gw, zoneW=((this.zoneMax-this.zoneMin)/100)*gw;
    bg.fillStyle(COLORS.turquoise,0.35); bg.fillRect(zoneX,gy,zoneW,gh);
    this.add.text(gx,gy-20,'COLD',{fontFamily:'Trebuchet MS, sans-serif',fontSize:'11px',color:'#8A7A9A'});
    this.add.text(gx+gw-30,gy-20,'HOT',{fontFamily:'Trebuchet MS, sans-serif',fontSize:'11px',color:'#8A7A9A'});
    this.gaugeFillG=this.add.graphics();
    this.drawGaugeFill();
  }
  drawGaugeFill(){
    this.gaugeFillG.clear();
    const pct=Phaser.Math.Clamp(this.temp,0,100)/100;
    const inZone=this.temp>=this.zoneMin && this.temp<=this.zoneMax;
    const color=inZone?COLORS.gold:(this.temp<this.zoneMin?0x6a8aa0:0xB3452E);
    this.gaugeFillG.fillStyle(color,0.9);
    this.gaugeFillG.fillRoundedRect(this.gx,this.gy,Math.max(this.gw*pct,4),this.gh,6);
  }
  buildStokeButton(){
    const btn=this.add.rectangle(400,428,190,42,COLORS.terracotta).setStrokeStyle(3,COLORS.outline,0.9).setInteractive({useHandCursor:true});
    this.add.text(400,428,'STOKE THE FIRE',{fontFamily:'Trebuchet MS, sans-serif',fontSize:'14px',fontStyle:'bold',color:'#1B1330'}).setOrigin(0.5);
    btn.on('pointerdown', () => {
      if (this.done) return;
      this.temp=Math.min(100,this.temp+18);
      this.tweens.add({ targets:btn, scaleX:0.94, scaleY:0.94, duration:80, yoyo:true });
      for (let i=0;i<3;i++) spawnParticle(this, 400+Phaser.Math.Between(-18,18), 244, { color:0xF5B44A, size:Phaser.Math.FloatBetween(1.5,3), dy:-Phaser.Math.Between(45,80), duration:600 });
    });
  }
  buildLoaves(){
    this.loaves=[];
    [260,400,540].forEach((x) => {
      const img=this.add.ellipse(x,300,50,32,0xE8D9B0).setStrokeStyle(2,COLORS.outline,0.7).setInteractive({useHandCursor:true});
      const label=this.add.text(x,300,'',{fontFamily:'Trebuchet MS, sans-serif',fontSize:'10px',fontStyle:'bold',color:'#1B1330'}).setOrigin(0.5);
      const loaf={ img, label, progress:0, state:'baking', pulseTween:null, steamTimer:Phaser.Math.FloatBetween(1,2) };
      img.on('pointerdown', () => this.tapLoaf(loaf));
      this.loaves.push(loaf);
    });
  }
  tapLoaf(loaf){
    if (this.done || loaf.state!=='done') return;
    if (loaf.pulseTween) { loaf.pulseTween.stop(); loaf.pulseTween=null; }
    loaf.img.setScale(1);
    this.batchesComplete++;
    this.updateProgressText();
    for (let i=0;i<5;i++){
      const ang=(i/5)*Math.PI*2;
      spawnParticle(this, loaf.img.x, loaf.img.y, { color:COLORS.gold, size:2.5, dx:Math.cos(ang)*28, dy:Math.sin(ang)*22-8, duration:420, ease:'Cubic.easeOut' });
    }
    loaf.state='baking'; loaf.progress=0; loaf.steamTimer=Phaser.Math.FloatBetween(1,2);
    loaf.img.setFillStyle(0xE8D9B0);
    loaf.label.setText('');
    this.tweens.add({ targets:loaf.img, scaleX:1.25, scaleY:1.25, duration:120, yoyo:true });
    if (this.batchesComplete>=this.batchTarget) this.finish();
  }
  updateProgressText(){
    this.progressText.setText('Loaves baked: '+this.batchesComplete+' / '+this.batchTarget);
  }
  update(time, delta){
    if (this.done) return;
    const dt=delta/1000;
    this.temp=Math.max(0,this.temp-6*dt);
    this.drawGaugeFill();

    const heatFactor = Phaser.Math.Clamp(this.temp/100, 0.22, 1.3);
    const flicker = 1 + Math.sin(time/90)*0.06;
    const glowScale = (0.65+heatFactor*0.55) * flicker;
    this.glowOuter.setScale(glowScale);
    this.glowInner.setScale(glowScale*0.9);
    this.glowOuter.setAlpha(Phaser.Math.Clamp(0.45+heatFactor*0.4,0,1));

    this.emberTimer -= dt;
    if (this.emberTimer <= 0){
      spawnParticle(this, 400+Phaser.Math.Between(-20,20), 240, { color:0xF5B44A, size:Phaser.Math.FloatBetween(1.5,3), dy:-Phaser.Math.Between(50,90), dx:Phaser.Math.Between(-15,15), duration:Phaser.Math.Between(700,1200) });
      this.emberTimer = Phaser.Math.FloatBetween(0.9,1.7) / heatFactor;
    }

    const inZone=this.temp>=this.zoneMin && this.temp<=this.zoneMax;
    this.loaves.forEach((loaf) => {
      if (loaf.state==='baking' && inZone){
        loaf.progress += dt;
        const t=Math.min(loaf.progress/6,1);
        loaf.img.setFillStyle(lerpColor(0xE8D9B0,0xC17A3A,t));

        loaf.steamTimer -= dt;
        if (loaf.steamTimer <= 0){
          spawnParticle(this, loaf.img.x+Phaser.Math.Between(-8,8), loaf.img.y-10, { color:0xEFE3C8, alpha:0.32, size:3.5, dy:-Phaser.Math.Between(24,38), dx:Phaser.Math.Between(-6,6), duration:1300 });
          loaf.steamTimer = Phaser.Math.FloatBetween(1.4,2.4);
        }

        if (loaf.progress>=6){
          loaf.state='done';
          loaf.label.setText('tap!');
          loaf.pulseTween=this.tweens.add({ targets:loaf.img, scaleX:1.1, scaleY:1.1, duration:260, yoyo:true, repeat:-1 });
        }
      }
    });
  }
  finish(){
    this.done=true;
    GameState.set('bakery-minigame-done', true);
    Dialogue.show([
      { speaker:'', text:"The last batch comes out golden. Outside, a cart is already waiting." }
    ], () => {
      this.cameras.main.fadeOut(500,0,0,0);
      this.cameras.main.once('camerafadeoutcomplete', () => {
        this.scene.start('RiverCutsceneScene', { nextScene:this.nextScene, nextSceneData:this.nextSceneData });
      });
    });
  }
}

/* =========================================================================
   RIVER CUTSCENE — short, non-interactive: the cart makes its daily trip.
   ========================================================================= */
class RiverCutsceneScene extends Phaser.Scene {
  constructor(){ super('RiverCutsceneScene'); }
  init(data){ this.nextScene=data.nextScene; this.nextSceneData=data.nextSceneData; }
  create(){
    fillSky(this,800,450,0xC98A5A,0x2a4a5a);
    this.add.circle(650,110,50,0xF0C85A,0.4);
    this.add.circle(650,110,30,0xF5D68C,0.85);

    for (let i=0;i<8;i++){
      const x=30+i*105+Phaser.Math.Between(-12,12);
      const reed=this.add.graphics();
      reed.lineStyle(3,0x3a5a3a,0.6);
      reed.beginPath(); reed.moveTo(x,322); reed.lineTo(x-4,286); reed.strokePath();
      reed.beginPath(); reed.moveTo(x+6,322); reed.lineTo(x+11,290); reed.strokePath();
      reed.beginPath(); reed.moveTo(x-8,322); reed.lineTo(x-11,296); reed.strokePath();
    }

    const river=this.add.graphics(); river.fillStyle(0x3a6a7a,0.85); river.fillRect(0,320,800,60);
    for (let i=0;i<10;i++){
      const s=this.add.ellipse(i*85+30,338+Phaser.Math.Between(-4,4),50,6,0x7ab8c8,0.4);
      this.tweens.add({ targets:s, alpha:0.12, scaleX:1.3, duration:900+Math.random()*500, yoyo:true, repeat:-1, delay:Math.random()*600 });
    }

    makeBirdTexture(this,'bird-tex');
    this.spawnBird(100,68,4200);
    this.time.delayedCall(1300, () => this.spawnBird(-40,92,3800));

    const caption=this.add.text(400,45,'Every afternoon, the same road. The same river.',{fontFamily:'Georgia, serif',fontStyle:'italic',fontSize:'16px',color:'#EFE3C8'}).setOrigin(0.5).setAlpha(0);
    this.tweens.add({ targets:caption, alpha:1, duration:600 });

    makeCartTexture(this,'cart-tex');
    const cart=this.add.image(-60,300,'cart-tex').setOrigin(0.5,1);
    this.bobTween=this.tweens.add({ targets:cart, y:296, duration:140, yoyo:true, repeat:-1 });
    this.tweens.add({ targets:cart, x:420, duration:2200, ease:'Sine.easeInOut', onComplete:() => {
      this.bobTween.stop(); cart.y=300;
      this.tipCart(cart);
    }});
  }
  spawnBird(x,y,dur){
    const b=this.add.image(x,y,'bird-tex');
    this.tweens.add({ targets:b, x:x+700, duration:dur, ease:'Linear' });
  }
  tipCart(cart){
    this.tweens.add({ targets:this.cameras.main, zoom:1.12, duration:400, yoyo:true, hold:900, ease:'Sine.easeInOut' });
    this.tweens.add({ targets:cart, angle:35, duration:500, onComplete:() => {
      for (let i=0;i<6;i++){
        const startX=410+i*4;
        const loaf=this.add.ellipse(startX, 282, 16,10, 0xC17A3A);
        const targetX=startX+Phaser.Math.Between(-20,40);
        this.tweens.add({ targets:loaf, x:targetX, y:325, duration:650, delay:i*80, ease:'Quad.easeIn', onComplete:() => {
          this.splash(loaf.x, 328);
          loaf.destroy();
        }});
      }
      this.time.delayedCall(1200, () => {
        this.tweens.add({ targets:cart, angle:0, x:900, duration:900 });
        this.time.delayedCall(700, () => this.finish());
      });
    }});
  }
  splash(x,y){
    for (let i=0;i<5;i++){
      const ang=(i/5)*Math.PI*2;
      spawnParticle(this, x, y, { color:0xCDEEF2, size:Phaser.Math.FloatBetween(2,3.5), dx:Math.cos(ang)*18, dy:Math.sin(ang)*8-4, duration:400, alpha:0.85, ease:'Cubic.easeOut' });
    }
    const ring=this.add.circle(x,y,10,0xCDEEF2,0).setStrokeStyle(2,0xCDEEF2,0.6).setScale(0.3);
    this.tweens.add({ targets:ring, scaleX:1.6, scaleY:1.6, alpha:0, duration:450, onComplete:()=>ring.destroy() });
  }
  finish(){
    this.cameras.main.fadeOut(500,0,0,0);
    this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start(this.nextScene, this.nextSceneData));
  }
}

/* =========================================================================
   CARPET SCENE — the world-map mechanic. Bug fixes baked in from earlier
   passes: backgrounds genuinely scroll (TileSprite tilePositionX advances),
   the carpet's collision body matches its baked texture exactly with no
   manual offset guesswork, and explicit y-threshold checks end the run at
   both the ceiling and the ground rather than relying on collideWorldBounds.
   ========================================================================= */
class CarpetScene extends Phaser.Scene {
  constructor(){ super('CarpetScene'); }
  init(data){
    this.initData = data;
    this.nextScene = data.nextScene || 'OpenAreaScene';
    this.nextSceneData = data.nextSceneData || {};
    this.targetDistance = data.distance || 2400;
    this.theme = data.theme || 'city';
    this.wind = data.wind || 0;
    this.gapSize = data.gapSize || 150;
    this.spawnRange = data.spawnRange || [1.3,1.8];
  }
  create(){
    this.distance=0; this.ended=false; this.started=false; this.spawnTimer=1.0;
    this.windTimer = Phaser.Math.FloatBetween(1.5,3);
    Touch.hide();
    this.physics.world.setBounds(0,0,800,450);

    this.buildBackground();

    makeCarpetTexture(this,'carpet-fly',64,20);
    this.carpet=this.physics.add.sprite(180,225,'carpet-fly');
    this.carpet.body.setAllowGravity(false);

    makeTasselTexture(this,'tassel');
    this.tasselL=this.add.image(180-34,225,'tassel').setOrigin(1,0.2);
    this.tasselR=this.add.image(180+34,225,'tassel').setOrigin(0,0.2).setFlipX(true);

    this.obstacles=this.physics.add.group();
    this.physics.add.collider(this.carpet, this.obstacles, () => this.crash(), null, this);

    this.distText=this.add.text(20,16,'',{fontFamily:'Trebuchet MS, sans-serif',fontSize:'15px',color:'#EFE3C8'}).setDepth(100);
    this.startPrompt=this.add.text(400,225,'Tap, click, or press Space to rise',{fontFamily:'Georgia, serif',fontSize:'19px',color:'#EFE3C8'}).setOrigin(0.5).setDepth(100);
    this.tweens.add({ targets:this.startPrompt, alpha:0.3, duration:700, yoyo:true, repeat:-1 });

    this.spaceKey=this.input.keyboard.addKey('SPACE');
    this.input.on('pointerdown', () => this.flap());
  }
  buildBackground(){
    const t = CARPET_THEMES[this.theme] || CARPET_THEMES.city;
    fillSky(this,800,450,t.skyTop,t.skyBottom);

    if (t.stars) {
      const starG=this.add.graphics();
      starG.fillStyle(0xF5EEDD,0.8);
      for (let i=0;i<40;i++) starG.fillCircle(Phaser.Math.Between(0,800),Phaser.Math.Between(0,190),Phaser.Math.FloatBetween(0.6,1.6));
      const moonG=this.add.graphics();
      moonG.fillStyle(0xEFE3C8,0.9); moonG.fillCircle(680,70,26);
    }

    makeMountainStripTexture(this,'mtn-strip-'+this.theme, t.silCol);
    this.mtnLayer=this.add.tileSprite(400,290,800,170,'mtn-strip-'+this.theme);

    const midKey='mid-strip-'+this.theme;
    if (t.useCity) makeCityStripTexture(this, midKey, t.silCol);
    else makeVillageStripTexture(this, midKey, t.silCol);
    this.cityLayer=this.add.tileSprite(400,355,800,130,midKey).setAlpha(0.85);

    makeGroundStripTexture(this,'ground-strip-'+this.theme, t.groundCol);
    this.groundLayer=this.add.tileSprite(400,432,800,36,'ground-strip-'+this.theme);

    makeCloudStripTexture(this,'cloud-strip-'+this.theme, t.cloudCol);
    this.cloudLayer=this.add.tileSprite(400,42,800,64,'cloud-strip-'+this.theme).setAlpha(t.cloudAlpha);

    if (t.storm) {
      this.lightning = this.add.rectangle(400,225,800,450,0xffffff,0).setDepth(80);
      this.lightningTimer = Phaser.Math.FloatBetween(2,4);
    }
  }
  update(time, delta){
    if (this.ended) return;
    if (Phaser.Input.Keyboard.JustDown(this.spaceKey)) this.flap();

    const dt=delta/1000;
    this.cloudLayer.tilePositionX += 8*dt;
    this.updateTassels(time);

    if (this.lightningTimer !== undefined) {
      this.lightningTimer -= dt;
      if (this.lightningTimer <= 0) {
        this.lightning.setAlpha(0.35);
        this.time.delayedCall(90, () => this.lightning.setAlpha(0));
        this.lightningTimer = Phaser.Math.FloatBetween(2.5,4.5);
      }
    }

    if (!this.started) return;

    this.distance += 210*dt;
    this.distText.setText('Distance: '+Math.min(Math.floor(this.distance),this.targetDistance)+' / '+this.targetDistance);

    this.mtnLayer.tilePositionX += 20*dt;
    this.cityLayer.tilePositionX += 55*dt;
    this.groundLayer.tilePositionX += 190*dt;

    if (this.wind > 0) {
      this.windTimer -= dt;
      if (this.windTimer <= 0) {
        this.carpet.body.velocity.y += Phaser.Math.Between(-1,1) * this.wind * 85;
        this.windTimer = Phaser.Math.FloatBetween(1.4,2.6);
      }
    }

    if (this.carpet.body.velocity.y < -260) this.carpet.body.velocity.y = -260;
    if (this.carpet.body.velocity.y > 340) this.carpet.body.velocity.y = 340;
    this.carpet.angle += Math.sin(time/260) * 0.4;

    if (this.carpet.y <= 42 || this.carpet.y >= 408) { this.crash(); return; }

    this.obstacles.getChildren().slice().forEach((o) => { if (o.x < -80) o.destroy(); });

    this.spawnTimer -= dt;
    if (this.spawnTimer <= 0) { this.spawnObstacle(); this.spawnTimer = Phaser.Math.FloatBetween(this.spawnRange[0], this.spawnRange[1]); }

    if (this.distance >= this.targetDistance) this.succeed();
  }
  updateTassels(time){
    this.tasselL.x=this.carpet.x-32; this.tasselL.y=this.carpet.y+2;
    this.tasselR.x=this.carpet.x+32; this.tasselR.y=this.carpet.y+2;
    this.tasselL.rotation=this.carpet.rotation*0.5+Math.sin(time/240)*0.15;
    this.tasselR.rotation=this.carpet.rotation*0.5+Math.sin(time/240+1)*0.15;
  }
  flap(){
    if (this.ended) return;
    if (!this.started){
      this.started=true; this.startPrompt.setVisible(false);
      this.carpet.body.setAllowGravity(true);
      this.carpet.body.setGravityY(620);
      this.carpet.body.setMaxVelocity(9999,340);
    }
    this.carpet.body.setVelocityY(-260);
    this.carpet.setAngle(-14);
    this.time.delayedCall(220, () => { if (!this.ended) this.carpet.setAngle(6); });
  }
  spawnObstacle(){
    const gapY=Phaser.Math.Between(100,310), gapSize=this.gapSize;
    const topH=Math.max(gapY-gapSize/2,10), botH=Math.max(450-(gapY+gapSize/2),10);
    const top=this.add.rectangle(830,0,48,topH,COLORS.terracotta).setOrigin(0,0).setStrokeStyle(3,COLORS.outline,0.85);
    const bot=this.add.rectangle(830,gapY+gapSize/2,48,botH,COLORS.terracotta).setOrigin(0,0).setStrokeStyle(3,COLORS.outline,0.85);
    [top,bot].forEach((rect)=>{
      this.physics.add.existing(rect);
      this.obstacles.add(rect);
      rect.body.setAllowGravity(false);
      rect.body.setImmovable(true);
      rect.body.setVelocityX(-190);
    });
  }
  crash(){
    if (this.ended) return;
    this.ended=true;
    this.carpet.body.setVelocity(0,0);
    this.physics.pause();
    this.add.rectangle(400,225,800,450,0x000000,0.5).setDepth(90);
    this.add.text(400,205,'The carpet dips low\u2014',{fontFamily:'Georgia, serif',fontSize:'21px',color:'#EFE3C8'}).setOrigin(0.5).setDepth(91);
    this.add.text(400,245,'Tap, click, or press Space to try again',{fontFamily:'Trebuchet MS, sans-serif',fontSize:'15px',color:'#E8A33D'}).setOrigin(0.5).setDepth(91);
    this.time.delayedCall(350, () => {
      this.input.once('pointerdown', () => this.scene.restart(this.initData));
      this.input.keyboard.once('keydown-SPACE', () => this.scene.restart(this.initData));
    });
  }
  succeed(){
    if (this.ended) return;
    this.ended=true;
    this.cameras.main.fadeOut(500,0,0,0);
    this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start(this.nextScene, this.nextSceneData));
  }
}

              { speaker:'Baker', text:"All I know is one name that go-between kept mentioning \u2014 a saddler. Said he'd know if any of this still mattered." },
              { speaker:'Baker', text:"Bring me word of the saddler, and maybe I'll have more to say. Until then, this is all you get." }
            ];
          }
          return [{ speaker:'Baker', text:"No time to talk. Ovens don't wait. Apron's on the hook, if you want to make yourself useful." }];
        },
        onComplete:(scene)=>{
          if (GameState.get('bakery-minigame-done')) {
            GameState.set('saddler-needed', true);
            scene.endOfSlice('Saddler');
          } else {
            scene.cameras.main.fadeOut(400,0,0,0);
            scene.cameras.main.once('camerafadeoutcomplete', () => {
              scene.scene.start('BakeryScene', { nextScene:'OpenAreaScene', nextSceneData:{areaKey:'baker'} });
            });
          }
        }
      }
    ],
    exits:[]
  }
};

/* =========================================================================
   BOOT
   ========================================================================= */
window.addEventListener('load', () => {
  GameState.restore();
  new Phaser.Game({
    type: Phaser.AUTO,
    width: 800,
    height: 450,
    parent: 'game-container',
    backgroundColor: '#1B1330',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    physics: { default:'arcade', arcade:{ gravity:{y:0}, debug:false } },
    scene: [TitleScene, IntroScene, MonthsEarlierScene, OpenAreaScene, PalaceScene, CarpetScene, BakeryScene, RiverCutsceneScene]
  });
});
</script>
</body>
</html>
